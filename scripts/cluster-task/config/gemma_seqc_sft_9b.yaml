### model
model_name_or_path: google/gemma-2-9b-it

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: task/deepspeed/ds_z3_config.json

### dataset
dataset: sft_all_seqc_train  # Add all languages here
dataset_dir: data/sft-dataset
template: gemma
cutoff_len: 1024
preprocessing_num_workers: 16

### output
output_dir: data/weight/sft/gemma-2-9b-it_epoch5/seqc/all
logging_steps: 10
save_steps: 200
eval_steps: 200
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-5
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.05
max_grad_norm: 1.0
optim: adamw_torch
fp16: true

### eval
evaluation_strategy: epoch
eval_dataset: sft_all_seqc_validation  # Add all languages here
per_device_eval_batch_size: 4
# predict_with_generate: true

### save
save_strategy: epoch
save_total_limit: 2